services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admindesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admindesk}
      POSTGRES_DB: ${POSTGRES_DB:-admindesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admindesk} -d ${POSTGRES_DB:-admindesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker
      POSTGRES_USER: ${POSTGRES_USER:-admindesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admindesk}
      POSTGRES_DB: ${POSTGRES_DB:-admindesk}
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY manquant (embeddings) - voir .env.example}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY manquant (chat) - voir .env.example}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
