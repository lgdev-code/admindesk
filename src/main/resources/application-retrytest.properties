# -------------------------------------------------------------
#  Profil "retrytest" — pour OBSERVER le retry Resilience4j
#  Lancer avec : --spring.profiles.active=retrytest
#  (hérite de application.properties, ne surcharge que ce qui suit)
# -------------------------------------------------------------
#
# But : provoquer une erreur TRANSITOIRE (et non un 401, non-retryable) pour voir
# Resilience4j réessayer. On pointe vers un port où rien n'écoute -> "Connection refused"
# immédiat, classé AIServerException (retryable) par LlmClient.classify().
spring.ai.anthropic.base-url=http://localhost:9

# On coupe le RetryTemplate INTERNE de Spring AI (defaut 10) : sinon il s'empile
# 10x par tentative Resilience4j -> lent et illisible. Ici on veut que SEUL le retry
# Resilience4j agisse, donc 1 seule tentative cote Spring AI.
spring.ai.retry.max-attempts=1

# Attendu dans les logs (max-attempts=3 = 1 appel + 2 retries) :
#   R4J  WARN  Retry 'anthropic-api' — tentative #1, attente PT1S
#   R4J  WARN  Retry 'anthropic-api' — tentative #2, attente PT2S
#   ...  WARN  AI fallback triggered (...)
# soit ~3s au total (backoff 1s puis 2s) au lieu d'un echec immediat.
