# -------------------------------------------------------------
#  AdminDesk - configuration de base
#  Branche : feat/d3-tp8-resilience-circuit-breaker-solution
# -------------------------------------------------------------

spring.application.name=admindesk

# -- Serveur ---------------------------------------------------
server.port=8080
server.servlet.context-path=/

# -- Base de donnees H2 (dev) ----------------------------------
spring.datasource.url=jdbc:h2:mem:admindesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (dev uniquement - a desactiver en prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chargement des donnees de test
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# -- Thymeleaf -------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# -- Actuator --------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,caches,circuitbreakers,retries
management.endpoint.health.show-details=always

# -- Cache (TP7) : Caffeine -------------------------------------
# 1 dependance + ces proprietes = cache pret. recordStats active le hit-rate.
spring.cache.type=caffeine
spring.cache.cache-names=summaries,reformulations,infos-manquantes,categories
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h,recordStats

# -- Logging ---------------------------------------------------
logging.level.fr.lgdev=DEBUG
logging.level.org.springframework.web=INFO
# Activer le log DEBUG Spring AI pour observer prompt + reponse brute (bonus 1 du TP).
# Le contenu du prompt/reponse est logge par le SimpleLoggerAdvisor (cf. AIConfig) ;
# le niveau global org.springframework.ai ne logge PAS le contenu a lui seul.
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{36} - %msg%n

# -- Infos applicatives ----------------------------------------
spring.application.description=Guichet numerique - Gestion des demandes administratives
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.formation=IFAP - IA dans les Developpements

# -------------------------------------------------------------
#  Spring AI - Anthropic
# -------------------------------------------------------------
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.options.max-tokens=1024
spring.ai.anthropic.chat.options.temperature=0.0
spring.ai.anthropic.http-client.connect-timeout=10s
spring.ai.anthropic.http-client.read-timeout=60s


# -------------------------------------------------------------
#  Resilience4j (TP8) - instance "anthropic-api"
# -------------------------------------------------------------
# Retry : 3 tentatives, backoff exponentiel, UNIQUEMENT sur exceptions transient.
resilience4j.retry.instances.anthropic-api.max-attempts=3
resilience4j.retry.instances.anthropic-api.wait-duration=1s
resilience4j.retry.instances.anthropic-api.exponential-backoff-multiplier=2
resilience4j.retry.instances.anthropic-api.retry-exceptions[0]=fr.lgdev.admindesk.service.ai.AITimeoutException
resilience4j.retry.instances.anthropic-api.retry-exceptions[1]=fr.lgdev.admindesk.service.ai.AIServerException

# TimeLimiter : borne la duree globale d'un appel (retries inclus).
resilience4j.timelimiter.instances.anthropic-api.timeout-duration=65s
resilience4j.timelimiter.instances.anthropic-api.cancel-running-future=true

# CircuitBreaker : ouvre si >50% d'echecs sur les 10 derniers appels (min 5).
resilience4j.circuitbreaker.instances.anthropic-api.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.anthropic-api.sliding-window-size=10
resilience4j.circuitbreaker.instances.anthropic-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.anthropic-api.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.anthropic-api.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.anthropic-api.register-health-indicator=true

# Ordre des aspects (plus PETIT = plus EXTERIEUR, semantique Spring Ordered).
# Defaut Resilience4j : Retry(ext) > CircuitBreaker > TimeLimiter(int) -> le fallback du
# CircuitBreaker, etant a l'interieur du Retry, se declenche des le 1er echec et court-circuite
# les retries. On force donc CircuitBreaker a l'EXTERIEUR : retries d'abord, fallback ensuite.
# Ordre obtenu : CircuitBreaker( Retry( TimeLimiter( appel ) ) ).
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2
resilience4j.timelimiter.time-limiter-aspect-order=3
