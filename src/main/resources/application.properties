# -------------------------------------------------------------
#  AdminDesk - configuration de base
#  Branche : feat/d1-base
# -------------------------------------------------------------

spring.application.name=admindesk

# -- Serveur ---------------------------------------------------
server.port=8080
server.servlet.context-path=/

# -- Base de donnees H2 (dev) ----------------------------------
spring.datasource.url=jdbc:h2:mem:admindesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (dev uniquement - a desactiver en prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chargement des donnees de test
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# -- Thymeleaf -------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# -- Actuator --------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# -- Logging ---------------------------------------------------
logging.level.fr.lgdev=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{36} - %msg%n

# -- Infos applicatives ----------------------------------------
spring.application.description=Guichet numerique - Gestion des demandes administratives
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.formation=IFAP - IA dans les Developpements

