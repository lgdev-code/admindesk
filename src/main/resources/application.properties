# -------------------------------------------------------------
#  AdminDesk - configuration de base
#  Branche : feat/d3-tp8-resilience
# -------------------------------------------------------------

spring.application.name=admindesk

# -- Serveur ---------------------------------------------------
server.port=8080
server.servlet.context-path=/

# -- Base de donnees H2 (dev) ----------------------------------
spring.datasource.url=jdbc:h2:mem:admindesk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (dev uniquement - a desactiver en prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chargement des donnees de test
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# -- Thymeleaf -------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# -- Actuator --------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# -- Cache (TP7) : Caffeine -------------------------------------
# 1 dependance + ces proprietes = cache pret. recordStats active le hit-rate.
spring.cache.type=caffeine
spring.cache.cache-names=summaries,reformulations,infos-manquantes,categories
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h,recordStats

# -- Logging ---------------------------------------------------
logging.level.fr.lgdev=DEBUG
logging.level.org.springframework.web=INFO
# Activer le log DEBUG Spring AI pour observer prompt + reponse brute (bonus 1 du TP).
# Le contenu du prompt/reponse est logge par le SimpleLoggerAdvisor (cf. AIConfig) ;
# le niveau global org.springframework.ai ne logge PAS le contenu a lui seul.
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{36} - %msg%n

# -- Infos applicatives ----------------------------------------
spring.application.description=Guichet numerique - Gestion des demandes administratives
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.formation=IFAP - IA dans les Developpements

# -------------------------------------------------------------
#  Serveur MCP (Model Context Protocol) - exposition des @Tool
# -------------------------------------------------------------
# Transport SSE via Spring MVC (starter spring-ai-starter-mcp-server-webmvc).
# Endpoint SSE par defaut : http://localhost:8080/sse
# Endpoint messages       : http://localhost:8080/mcp/message
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=admindesk-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# -------------------------------------------------------------
#  Spring AI - Anthropic
# -------------------------------------------------------------
# Le starter OpenAI est present au classpath (embeddings pgvector, cf. profil prod).
# Sans selection explicite, il auto-configure aussi un ChatModel => 2 beans ChatModel
# (anthropicChatModel + openAiChatModel) et le contexte ne demarre plus.
# On fixe le provider de chat sur Anthropic des le profil par defaut (tests inclus).
spring.ai.model.chat=anthropic

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.options.max-tokens=1024
spring.ai.anthropic.chat.options.temperature=0.0
spring.ai.anthropic.http-client.connect-timeout=10s
spring.ai.anthropic.http-client.read-timeout=60s

# -------------------------------------------------------------
#  Spring AI - RAG (TP9/TP10) : desactive hors prod
# -------------------------------------------------------------
# Le RAG (embeddings OpenAI + vectorStore pgvector) exige un PostgreSQL/pgvector et
# une cle OpenAI : ces ressources n'existent qu'en profil prod (application-prod.properties).
# En dev/test (H2, sans cle) on coupe l'auto-config OpenAI embeddings et pgvector,
# sinon les beans 'openAiEmbeddingModel'/'vectorStore' echouent et le contexte ne demarre pas.
# Le profil prod re-active tout en surchargeant ces deux proprietes.
spring.ai.model.embedding=none
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Le starter OpenAI auto-configure aussi image/audio/moderation (tous exigent la cle).
# L'appli ne s'en sert pas : on les coupe partout (y compris prod).
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
