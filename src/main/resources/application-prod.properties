# =====================================================================
#  Profil prod — D4 (RAG)   →   ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
#  Tout est paramétré par variables d'environnement. La variable STAGIAIRE
#  identifie le compte/schéma du stagiaire (isolation des vecteurs).
# =====================================================================

# --- Datasource Neon (PostgreSQL + pgvector) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${STAGIAIRE}
spring.datasource.password=${STAGIAIRE}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Embeddings OpenAI (Anthropic ne fournit pas d'embeddings) ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.model.chat=anthropic
# le chat reste sur Anthropic (Claude Haiku) ; OpenAI ne sert qu'aux embeddings

# Re-active le RAG (le profil par defaut le coupe pour dev/test sur H2) :
# embeddings OpenAI + auto-config pgvector.
spring.ai.model.embedding=openai
spring.autoconfigure.exclude=

# --- VectorStore pgvector ---
spring.ai.vectorstore.pgvector.schema-name=${STAGIAIRE}
spring.ai.vectorstore.pgvector.dimensions=1536

# --- Observabilité RAG (D5) ---
# Crée automatiquement les tables rag_audit / rag_feedback / rag_eval_run au
# démarrage (DDL idempotent, PostgreSQL uniquement -> profil prod seulement).
# data.sql (données dev) continue d'être chargé via la data-location par défaut.
# Les données de DÉMO du dashboard restent dans db/rag-observability.sql (manuel).
spring.sql.init.schema-locations=classpath:db/schema-rag-observability.sql