# =====================================================================
#  Profil "docker" — a activer EN PLUS de "prod" : SPRING_PROFILES_ACTIVE=prod,docker
#  Ne surcharge que la connexion DB / pgvector du profil prod, pour pointer
#  vers le Postgres local du docker-compose (image pgvector/pgvector) au lieu
#  de Neon. Le reste (cles OpenAI/Anthropic, modele de chat...) vient de prod.
# =====================================================================

spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:admindesk}
spring.datasource.username=${POSTGRES_USER:admindesk}
spring.datasource.password=${POSTGRES_PASSWORD:admindesk}

# Schema fixe "public" (pas de notion de STAGIAIRE en local) + creation
# automatique de l'extension/table pgvector au demarrage (base vide au 1er run).
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true
