<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tableau de bord')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="bi bi-bar-chart-line me-2 text-primary"></i>Tableau de bord
        </h1>
        <a href="/demandes/nouveau" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nouvelle demande
        </a>
    </div>

    <!-- Total -->
    <div class="row g-4 mb-4">
        <div class="col-12">
            <div class="card shadow-sm text-white bg-primary">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fs-2 fw-bold" th:text="${total}">0</div>
                        <div class="opacity-75">Demandes au total</div>
                    </div>
                    <i class="bi bi-inbox fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats par statut -->
    <h5 class="text-muted mb-3">Par statut</h5>
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-sm-6" th:each="entry : ${statsStatut}">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fs-3 fw-bold" th:text="${entry.value}">0</div>
                        <div class="text-muted small" th:text="${entry.key}"></div>
                    </div>
                    <i class="bi bi-tag fs-2 text-muted opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">

        <!-- Stats par type -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-semibold">
                    <i class="bi bi-grid me-2"></i>Par type
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <tbody>
                        <tr th:each="entry : ${statsType}">
                            <td th:text="${entry.key}"></td>
                            <td class="text-end">
                                <span class="badge bg-primary rounded-pill"
                                      th:text="${entry.value}"></span>
                            </td>
                            <td style="width:40%">
                                <div class="progress" style="height:6px;">
                                    <div class="progress-bar"
                                         th:style="'width:' + (${entry.value} * 100 / ${total}) + '%'">
                                    </div>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Stats par priorité -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-semibold">
                    <i class="bi bi-flag me-2"></i>Par priorité
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <tbody>
                        <tr th:each="entry : ${statsPriorite}">
                            <td th:text="${entry.key}"></td>
                            <td class="text-end">
                                <span class="badge bg-secondary rounded-pill"
                                      th:text="${entry.value}"></span>
                            </td>
                            <td style="width:40%">
                                <div class="progress" style="height:6px;">
                                    <div class="progress-bar bg-warning"
                                         th:style="'width:' + (${entry.value} * 100 / ${total}) + '%'">
                                    </div>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Lien API REST -->
    <div class="alert alert-light border mt-4 d-flex align-items-center gap-3">
        <i class="bi bi-braces fs-4 text-primary"></i>
        <div>
            <strong>API REST disponible</strong> —
            <a href="/api/v1/demandes" target="_blank">/api/v1/demandes</a>
            ·
            <a href="/api/v1/demandes/stats" target="_blank">/api/v1/demandes/stats</a>
            ·
            <a href="/h2-console" target="_blank">H2 Console</a>
        </div>
    </div>

</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
