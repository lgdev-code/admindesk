<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modeEdition} ? 'Modifier la demande' : 'Nouvelle demande')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/demandes">Demandes</a></li>
            <li th:if="${modeEdition}" class="breadcrumb-item">
                <a th:href="@{/demandes/{id}(id=${demande.id})}"
                   th:text="${demande.reference}"></a>
            </li>
            <li class="breadcrumb-item active"
                th:text="${modeEdition} ? 'Modifier' : 'Nouvelle demande'"></li>
        </ol>
    </nav>

    <h1 class="h3 mb-4">
        <i class="bi bi-pencil-square me-2 text-primary"></i>
        <span th:text="${modeEdition} ? 'Modifier la demande ' + demande.reference : 'Nouvelle demande'"></span>
    </h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${modeEdition} ? @{/demandes/{id}/modifier(id=${demande.id})} : @{/demandes/nouveau}"
                  th:object="${dto}"
                  method="post"
                  novalidate>

                <div class="row g-4">

                    <!-- Demandeur -->
                    <div class="col-12">
                        <h5 class="text-muted border-bottom pb-2 mb-3">Informations demandeur</h5>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Nom complet <span class="text-danger">*</span></label>
                        <input type="text" class="form-control"
                               th:field="*{nomDemandeur}"
                               th:classappend="${#fields.hasErrors('nomDemandeur')} ? 'is-invalid'"
                               placeholder="Prénom Nom"/>
                        <div class="invalid-feedback" th:errors="*{nomDemandeur}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control"
                               th:field="*{emailDemandeur}"
                               th:classappend="${#fields.hasErrors('emailDemandeur')} ? 'is-invalid'"
                               placeholder="prenom.nom@email.fr"/>
                        <div class="invalid-feedback" th:errors="*{emailDemandeur}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Téléphone</label>
                        <input type="tel" class="form-control"
                               th:field="*{telephoneDemandeur}"
                               placeholder="06 XX XX XX XX"/>
                    </div>

                    <!-- Demande -->
                    <div class="col-12 mt-2">
                        <h5 class="text-muted border-bottom pb-2 mb-3">Détail de la demande</h5>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Type <span class="text-danger">*</span></label>
                        <select class="form-select"
                                th:field="*{type}"
                                th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                            <option value="">-- Sélectionner un type --</option>
                            <option th:each="t : ${types}"
                                    th:value="${t}"
                                    th:text="${t.libelle}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{type}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Priorité</label>
                        <select class="form-select" th:field="*{priorite}">
                            <option th:each="p : ${priorites}"
                                    th:value="${p}"
                                    th:text="${p.libelle}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Statut</label>
                        <select class="form-select" th:field="*{statut}">
                            <option th:each="s : ${statuts}"
                                    th:value="${s}"
                                    th:text="${s.libelle}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">
                            Description <span class="text-danger">*</span>
                            <small class="text-muted fw-normal ms-2">(20 à 4000 caractères)</small>
                        </label>
                        <textarea class="form-control"
                                  th:field="*{description}"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                  rows="6"
                                  placeholder="Décrivez la demande en détail…"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                        <div class="form-text text-end">
                            <span id="charCount">0</span> / 4000 caractères
                        </div>
                    </div>

                    <!-- Traitement -->
                    <div class="col-12 mt-2">
                        <h5 class="text-muted border-bottom pb-2 mb-3">Traitement</h5>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Agent traitant</label>
                        <input type="text" class="form-control"
                               th:field="*{agentTraitant}"
                               placeholder="Prénom Nom"/>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Commentaire agent</label>
                        <textarea class="form-control"
                                  th:field="*{commentaireAgent}"
                                  rows="3"
                                  placeholder="Notes internes de traitement…"></textarea>
                    </div>

                </div>

                <hr class="my-4"/>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${modeEdition} ? 'Enregistrer les modifications' : 'Créer la demande'"></span>
                    </button>
                    <a th:href="${modeEdition} ? @{/demandes/{id}(id=${demande.id})} : '/demandes'"
                       class="btn btn-outline-secondary">
                        Annuler
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    const textarea = document.querySelector('textarea[name="description"]');
    const counter  = document.getElementById('charCount');
    if (textarea && counter) {
        const update = () => counter.textContent = textarea.value.length;
        textarea.addEventListener('input', update);
        update();
    }
</script>
</body>
</html>
