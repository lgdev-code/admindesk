<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' – AdminDesk'">AdminDesk</title>
    <!-- Bootstrap 5.3 CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: .5px; }
        .sidebar { min-height: calc(100vh - 56px); background: #fff; border-right: 1px solid #dee2e6; }
        .badge-urgente  { background-color: #dc3545 !important; }
        .badge-haute    { background-color: #fd7e14 !important; }
        .badge-normale  { background-color: #0d6efd !important; }
        .badge-basse    { background-color: #198754 !important; }
        .card-stat { border-left: 4px solid; }
        .card-stat.en-attente { border-color: #ffc107; }
        .card-stat.en-cours   { border-color: #0dcaf0; }
        .card-stat.traite     { border-color: #198754; }
        .card-stat.urgente    { border-color: #dc3545; }
        pre.description { white-space: pre-wrap; font-family: inherit; }
        .ia-block { background: #e8f4ff; border-left: 4px solid #0d6efd;
                    border-radius: 4px; padding: 1rem; margin-top: 1rem; }
    </style>
</head>

<!-- ── Navbar ──────────────────────────────────────────────── -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/demandes">
            <i class="bi bi-building-check me-2"></i>AdminDesk
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/demandes">
                        <i class="bi bi-list-ul me-1"></i>Demandes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/demandes/dashboard">
                        <i class="bi bi-bar-chart-line me-1"></i>Tableau de bord
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/demandes/nouveau">
                        <i class="bi bi-plus-circle me-1"></i>Nouvelle demande
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/rag">
                        <i class="bi bi-robot me-1"></i>Assistant RAG
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/rag/dashboard">
                        <i class="bi bi-speedometer2 me-1"></i>RAG Quality
                    </a>
                </li>
            </ul>
            <span class="navbar-text text-white-50 small">
                <i class="bi bi-cpu me-1"></i>Formation IFAP
            </span>
        </div>
    </div>
</nav>

<!-- ── Footer ─────────────────────────────────────────────── -->
<footer th:fragment="footer" class="text-center text-muted small py-3 mt-5 border-top">
    AdminDesk &copy; 2026 – LGDEV - IFAP Formation
    <span class="ms-3"><i class="bi bi-cpu"></i> <em th:text="${binomeId ?: 'dev'}">dev</em></span>
</footer>

<!-- ── Scripts ────────────────────────────────────────────── -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
