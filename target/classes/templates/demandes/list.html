<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Liste des demandes')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid py-4">

    <!-- ── Alertes flash ─────────────────────────────────────── -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}">Succès</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ── En-tête ───────────────────────────────────────────── -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            <i class="bi bi-inbox me-2 text-primary"></i>Demandes administratives
        </h1>
        <a href="/demandes/nouveau" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Nouvelle demande
        </a>
    </div>

    <!-- ── Filtres ───────────────────────────────────────────── -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="get" action="/demandes" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Recherche</label>
                    <input type="text" name="search" class="form-control"
                           placeholder="Nom, référence, description…"
                           th:value="${search}"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Statut</label>
                    <select name="statut" class="form-select">
                        <option value="">Tous les statuts</option>
                        <option th:each="s : ${statuts}"
                                th:value="${s}"
                                th:text="${s.libelle}"
                                th:selected="${s == filtreStatut}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Type</label>
                    <select name="type" class="form-select">
                        <option value="">Tous les types</option>
                        <option th:each="t : ${types}"
                                th:value="${t}"
                                th:text="${t.libelle}"
                                th:selected="${t == filtreType}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Priorité</label>
                    <select name="priorite" class="form-select">
                        <option value="">Toutes</option>
                        <option th:each="p : ${priorites}"
                                th:value="${p}"
                                th:text="${p.libelle}"
                                th:selected="${p == filtrePriorite}">
                        </option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <div class="col-md-1">
                    <a href="/demandes" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-circle"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- ── Tableau ───────────────────────────────────────────── -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Référence</th>
                        <th>Demandeur</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Statut</th>
                        <th>Priorité</th>
                        <th>Agent</th>
                        <th>Date</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${demandes.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Aucune demande trouvée
                        </td>
                    </tr>
                    <tr th:each="d : ${demandes}">
                        <td class="fw-mono small">
                            <a th:href="@{/demandes/{id}(id=${d.id})}"
                               th:text="${d.reference}"
                               class="text-decoration-none fw-semibold">
                            </a>
                        </td>
                        <td th:text="${d.nomDemandeur}"></td>
                        <td>
                            <span class="badge bg-light text-dark border"
                                  th:text="${d.type.libelle}">
                            </span>
                        </td>
                        <td class="text-muted small"
                            style="max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                            th:text="${d.description}">
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="'bg-' + ${d.statut.badgeCss}"
                                  th:text="${d.statut.libelle}">
                            </span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="'badge-' + ${#strings.toLowerCase(d.priorite.name())}"
                                  th:text="${d.priorite.libelle}">
                            </span>
                        </td>
                        <td class="small text-muted"
                            th:text="${d.agentTraitant ?: '—'}">
                        </td>
                        <td class="small text-muted"
                            th:text="${#temporals.format(d.dateCreation, 'dd/MM/yyyy')}">
                        </td>
                        <td class="text-end">
                            <a th:href="@{/demandes/{id}(id=${d.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/demandes/{id}/modifier(id=${d.id})}"
                               class="btn btn-sm btn-outline-secondary ms-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ── Pagination ────────────────────────────────────── -->
        <div class="card-footer d-flex justify-content-between align-items-center"
             th:if="${demandes.totalPages > 1}">
            <small class="text-muted">
                Page <span th:text="${demandes.number + 1}"></span>
                sur <span th:text="${demandes.totalPages}"></span>
                (<span th:text="${demandes.totalElements}"></span> résultats)
            </small>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${demandes.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/demandes(page=${demandes.number - 1},
                                        search=${search}, statut=${filtreStatut},
                                        type=${filtreType}, priorite=${filtrePriorite})}">
                            &laquo;
                        </a>
                    </li>
                    <li class="page-item" th:classappend="${demandes.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/demandes(page=${demandes.number + 1},
                                        search=${search}, statut=${filtreStatut},
                                        type=${filtreType}, priorite=${filtrePriorite})}">
                            &raquo;
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
